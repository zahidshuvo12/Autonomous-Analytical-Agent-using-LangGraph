[project]
name = "langgraph-analyst-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zahidshuvo12", email = "zahidshuvo12@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "colorama>=0.4.6",
    "dotenv>=0.9.9",
    "langchain>=1.4.1",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.2",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "langgraph-cli>=0.4.31",
]

[project.scripts]
